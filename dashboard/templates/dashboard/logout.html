{% extends 'dashboard/base.html' %}
{% block title %}خروج{% endblock %}
{% block content %}
<div style="text-align:center;padding:50px;">
    <h2>خروج از سیستم</h2>
    <p>آیا مطمئن هستید؟</p>
    <form method="post" style="display:flex;gap:15px;justify-content:center;">
        {% csrf_token %}
        <button type="submit" class="btn-booking">خروج</button>
        <a href="{% url 'dashboard:dashboard' %}" class="btn-danger">انصراف</a>
    </form>
</div>
{% endblock %}
